name: KHAIRUL AUTO PAYMENT - WIF Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin

      - name: Check reminders (dry run only)
        run: node scripts/whatsapp-reminder.js
